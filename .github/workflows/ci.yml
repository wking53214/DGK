name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cns]"
          python -m pip install pytest

      - name: Run test suite, and fail on any skip
        # The CNS interface tests skip when CNS is missing. It is installed
        # here, so a skip would mean the interface went untested.
        run: |
          python -m pytest tests/ -q -rs | tee out.txt
          ! grep -qi "skipped" out.txt

      - name: Run the kernel demo end to end
        run: python examples/run_kernel_demo.py
