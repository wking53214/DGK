name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run the kernel demo end to end
        run: python examples/run_kernel_demo.py

  cns:
    # The optional CNS connector (dgk.cns_connector), with the extra installed. DGK_REQUIRE_CNS=1 turns a
    # missing cns into a failure, so these tests cannot silently skip here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with the cns extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cns]"
          python -m pip install pytest

      - name: Run the test suite with CNS present
        env:
          DGK_REQUIRE_CNS: "1"
        run: python -m pytest tests/ -q -rs
